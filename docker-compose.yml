version: '3'
services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  server:
    build: ./server
    env_file:
      - ./server/.env
    depends_on:
      - mongo
      - redis
    ports:
      - "4000:4000"
  client:
    build: ./client
    env_file:
      - ./client/.env
    depends_on:
      - server
    ports:
      - "5173:80"
